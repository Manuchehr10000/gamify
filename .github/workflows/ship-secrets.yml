# Ship kit: the secret scan on every branch other than dev, main and master (D70); the Ship check scans those.
# Written by /mg-ship-kit:setup and owned by the kit: don't edit it here. Rerun /mg-ship-kit:setup to update it.
# A key pushed to any branch is on GitHub: this run goes red so you see it at once. Replace the key at its source.
name: Ship secret scan

on:
  push:
    branches-ignore: [dev, main, master]

permissions:
  contents: read

jobs:
  scan:
    name: Ship secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gitleaks (the version the kit pins, checked against its published checksum)
        run: |
          v=8.30.1
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Scan the pushed commits
        env:
          SHIP_BEFORE: ${{ github.event.before }}
        run: python3 .github/ship/ship_check.py secret-scan --ci --branch "$GITHUB_REF_NAME" --after "$GITHUB_SHA"
